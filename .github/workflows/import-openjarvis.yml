name: Import official OpenJarvis source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-openjarvis.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Clone official OpenJarvis
        run: git clone --depth 1 https://github.com/open-jarvis/OpenJarvis.git /tmp/OpenJarvis
      - name: Copy official files to repository root and commit
        run: |
          rsync -a --exclude='.git' /tmp/OpenJarvis/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import official OpenJarvis source"
            git push origin HEAD:main
          fi
