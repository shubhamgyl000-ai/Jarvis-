name: Import official OpenJarvis source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-openjarvis.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jarvis repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clone official OpenJarvis source
        run: git clone --depth 1 https://github.com/open-jarvis/OpenJarvis.git /tmp/OpenJarvis
      - name: Copy official source files to repository root
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/***' /tmp/OpenJarvis/ ./
      - name: Commit and push imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import official OpenJarvis source"
            git push origin HEAD:main
          fi
